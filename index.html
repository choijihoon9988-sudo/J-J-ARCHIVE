    <script type="text/babel">

        // --- Icons (Feather Icons style) ---

            ExternalLink: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,

            RefreshCw: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
            Book: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>,
            Folder: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            FileText: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
            Layout: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>,
            Edit3: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>,
            Save: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
        };

        // --- Config & Data ---
        const CATEGORIES = {
            BUSINESS: { id: 'business', name: 'Business', color: 'bg-blue-100 text-blue-600' },
            MINDSET: { id: 'mindset', name: 'Mindset', color: 'bg-purple-100 text-purple-600' },
            PSYCHOLOGY: { id: 'psychology', name: 'Psychology', color: 'bg-rose-100 text-rose-600' },
            TECH: { id: 'tech', name: 'Tech', color: 'bg-emerald-100 text-emerald-600' },
        };

        const ALLOWED_EMAILS = [
            "jihoo@example.com",
            "choijihoon9988@gmail.com",
            "jihoo0420@gmail.com"
        ];

        // Combine Data
        const COURSES = [
            window.JACHUNG_COURSE_DATA,
            window.COURSE_DATA_WRITING,
            window.COURSE_DATA_MBTI,
            window.COURSE_DATA_INSTA,
            window.COURSE_DATA_LEESEOP
        ].filter(Boolean);


        // --- Component: Login Screen ---
        const LoginScreen = ({ onLogin }) => {
            const [error, setError] = useState(null);
            const [isAuthenticating, setIsAuthenticating] = useState(false);

            const handleSignIn = () => {
                setIsAuthenticating(true);
                setError(null);
                const { auth, provider, signInWithPopup, signOut } = window.firebaseAuth;
                
                signInWithPopup(auth, provider)
                   .then((result) => {
                        const email = result.user.email;
                        // Whitelist Check
                        if (ALLOWED_EMAILS.includes(email)) {
                            onLogin(result.user);
                        } else {
                             setError("죄송합니다. 초대된 사용자만 접근할 수 있습니다.");
                             signOut(auth);
                             setIsAuthenticating(false);
                        }
                    })
                   .catch((error) => {
                        console.error(error);
                        setError("인증에 실패했습니다. 다시 시도해주세요.");
                        setIsAuthenticating(false);
                    });
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-toss-bg p-6">
                    <div className="w-full max-w-[400px] animate-fade-in flex flex-col items-center">
                        <div className="w-16 h-16 bg-toss-blue rounded-3xl flex items-center justify-center mb-8 shadow-lg shadow-blue-500/20">
                            <Icons.Lock className="text-white w-8 h-8" />
                        </div>
                        
                        <h1 className="text-3xl font-bold text-toss-black mb-3 text-center">J&J Archive</h1>
                        <p className="text-toss-grey600 text-center mb-10 leading-relaxed">
                            서로의 성장을 위해 준비된<br/>
                            프라이빗 지식 플랫폼입니다.
                        </p>

                        <div className="bg-white p-8 rounded-[32px] shadow-card w-full">
                            <button 
                                onClick={handleSignIn}
                                disabled={isAuthenticating}
                                className="w-full py-4 bg-toss-blue hover:bg-blue-600 text-white font-semibold rounded-2xl transition-all active:scale-[0.98] disabled:opacity-70 flex items-center justify-center gap-2"
                            >
                                {isAuthenticating ? (
                                    <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                ) : (
                                    <>
                                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5 bg-white rounded-full p-0.5" alt="G" />
                                        <span>Google 계정으로 계속하기</span>
                                    </>
                                )}
                            </button>
                            
                            {error && (
                                <div className="mt-4 p-3 bg-red-50 text-red-500 text-sm rounded-xl text-center font-medium">
                                    {error}
                                </div>
                            )}

                            <p className="mt-6 text-[13px] text-toss-grey400 text-center">
                                승인된 계정(choijihoon9988, jihoo0420)만<br/>접속이 가능합니다.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };


        // --- Component: Lecture Player (Modal/Page) ---
        const LecturePlayer = ({ course, initialLecture, notes, onSaveNote, onClose }) => {
            const [currentLecture, setCurrentLecture] = useState(() => initialLecture || course.chapters?.[0]?.lectures?.[0] || null);
            const [activeTab, setActiveTab] = useState('CURRICULUM'); // 'CURRICULUM' | 'NOTE'
            const [noteContent, setNoteContent] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => document.body.style.overflow = 'unset';
            }, []);

            // Load note when lecture changes
            useEffect(() => {
                if (currentLecture && currentLecture.videoId) {
                    setNoteContent(notes[currentLecture.videoId] || '');
                }
            }, [currentLecture, notes]);

            const handleLaunchVideo = () => {
                if (!currentLecture || !currentLecture.videoId) return;
                let videoId = currentLecture.videoId.trim();
                let url = videoId.startsWith('http') ? videoId : `https://www.youtube.com/watch?v=${videoId}`;
                window.open(url, '_blank');
            };

            const handleNoteChange = (e) => {
                setNoteContent(e.target.value);
            };

            const handleNoteSave = () => {
                if (currentLecture && currentLecture.videoId) {
                    setIsSaving(true);
                    onSaveNote(currentLecture.videoId, noteContent);
                    setTimeout(() => setIsSaving(false), 800);
                }
            };

            if (!currentLecture) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-0 md:p-6 animate-fade-in bg-white md:bg-transparent">
                    <div className="hidden md:block absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    
                    <div className="relative bg-white w-full h-full md:h-[85vh] md:max-w-6xl rounded-none md:rounded-[32px] shadow-none md:shadow-2xl overflow-hidden flex flex-col md:flex-row animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 z-50 p-2 bg-black/20 backdrop-blur-md rounded-full md:hidden">
                            <Icons.X className="text-white" />
                        </button>

                        <div className="shrink-0 md:flex-[1.5] bg-toss-grey900 relative flex flex-col">
                             <div className="absolute inset-0 z-0">
                                <img src={course.image} className="w-full h-full object-cover opacity-20 blur-xl scale-110" />
                                <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/60 to-transparent"></div>
                             </div>

                             <div className="relative z-10 flex flex-col items-center justify-center p-8 md:p-10 text-center text-white min-h-[40vh] md:min-h-0 md:flex-1">
                                <div className="mb-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-[11px] font-bold tracking-wider uppercase text-blue-200">
                                    Private Source
                                </div>
                                <h2 className="text-xl md:text-4xl font-bold mb-6 leading-tight max-w-2xl text-shadow-sm line-clamp-3">
                                    {currentLecture.title}
                                </h2>
                                
                                <button 
                                    onClick={handleLaunchVideo}
                                    className="group relative px-6 py-3 md:px-8 md:py-4 bg-toss-blue hover:bg-blue-500 text-white rounded-2xl font-semibold text-base md:text-lg transition-all hover:scale-105 shadow-lg shadow-blue-500/30 flex items-center gap-3"
                                >
                                    <Icons.Play fill="currentColor" className="group-hover:translate-x-0.5 transition-transform" />
                                    <span>영상 재생하기</span>
                                </button>
                                
                                <p className="mt-6 text-white/40 text-xs md:text-sm max-w-md hidden md:block">
                                    보안을 위해 외부 플레이어(YouTube)로 안전하게 연결됩니다.
                                </p>
                             </div>
                        </div>

                        <div className="flex-1 bg-white flex flex-col border-l border-toss-grey200 overflow-hidden">
                            <div className="p-4 border-b border-toss-grey100 flex justify-between items-center shrink-0">
                                <div className="flex items-center gap-1 bg-toss-grey100 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setActiveTab('CURRICULUM')}
                                        className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${activeTab === 'CURRICULUM' ? 'bg-white text-toss-blue shadow-sm' : 'text-toss-grey500'}`}
                                    >
                                        목차
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('NOTE')}
                                        className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-1 ${activeTab === 'NOTE' ? 'bg-white text-toss-blue shadow-sm' : 'text-toss-grey500'}`}
                                    >
                                        노트
                                        {noteContent && <div className="w-1.5 h-1.5 rounded-full bg-toss-blue"></div>}
                                    </button>
                                </div>
                                <button onClick={onClose} className="hidden md:block p-2 hover:bg-toss-grey100 rounded-full transition-colors text-toss-grey600">
                                    <Icons.X />
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scroll relative bg-white">
                                {activeTab === 'CURRICULUM' ? (
                                    <div className="p-4">
                                        <div className="mb-4">
                                            <h3 className="text-base font-bold text-toss-black">{course.title}</h3>
                                            <p className="text-xs text-toss-grey500 mt-0.5">{course.instructor} • Total {course.chapters.reduce((acc, ch) => acc + ch.lectures.length, 0)} lectures</p>
                                        </div>
                                        {course.chapters.map((chapter, idx) => (
                                            <div key={idx} className="mb-6">
                                                <h4 className="text-xs font-bold text-toss-grey500 uppercase tracking-wider mb-3 px-2">
                                                    {chapter.title}
                                                </h4>
                                                <div className="space-y-1">
                                                    {chapter.lectures.map((lecture, lIdx) => {
                                                        const isActive = currentLecture.title === lecture.title;
                                                        return (
                                                            <button
                                                                key={lIdx}
                                                                onClick={() => setCurrentLecture(lecture)}
                                                                className={`w-full text-left p-3 rounded-xl flex items-center gap-3 transition-all duration-200
                                                                    ${isActive 
                                                                        ? 'bg-toss-blueLight text-toss-blue font-medium' 
                                                                        : 'hover:bg-toss-grey100 text-toss-grey700'
                                                                    }`}
                                                            >
                                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${isActive ? 'bg-toss-blue text-white' : 'bg-toss-grey200 text-toss-grey500'}`}>
                                                                    {isActive ? <Icons.Play size={10} fill="currentColor"/> : <span className="text-[10px] font-bold">{lIdx + 1}</span>}
                                                                </div>
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="truncate text-[14px]">{lecture.title}</div>
                                                                    <div className="text-[11px] opacity-60 mt-0.5">{lecture.duration}</div>
                                                                </div>
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

        // --- Component: Knowledge Slot Machine ---
        const KnowledgeSlotMachine = ({ courses, onRecommend }) => {
            const [isSpinning, setIsSpinning] = useState(false);
            const [slots, setSlots] = useState({ category: '???', action: '???' });
            const [recommendation, setRecommendation] = useState(null);

            const categories = ['BUSINESS', 'MINDSET', 'PSYCHOLOGY', 'TECH'];

            // --- Logic Helper Functions ---
            const parseDuration = (durationStr) => {
                if (!durationStr) return 0;
                // Format: "MM:SS" or "HH:MM:SS"
                const parts = durationStr.split(':').map(Number);
                if (parts.length === 2) return parts[0]; // Just return minutes
                if (parts.length === 3) return parts[0] * 60 + parts[1];
                return 0;
            };

            const actions = [
                { 
                    label: '가볍게 스낵 지식', 
                    filter: (l) => parseDuration(l.duration) <= 10 
                },
                { 
                    label: '진득하게 딥다이브', 
                    filter: (l) => parseDuration(l.duration) >= 20 
                },
                { 
                    label: '실전 노하우 흡수', 
                    filter: (l) => /법|방법|팁|가이드|기술|How|만들기|사용법/.test(l.title)
                },
                { 
                    label: '본질 꿰뚫기', 
                    filter: (l) => /원리|이론|본질|마인드|개념|이해|이유|구조|분석/.test(l.title)
                },
                { 
                    label: '친구에게 공유', 
                    filter: (l) => {
                        const mins = parseDuration(l.duration);
                        return mins >= 5 && mins <= 15 && /비밀|공식|충격|사실|Best|Top/.test(l.title);
                    } 
                }
            ];

            const handleSpin = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                setRecommendation(null);

                // Visual Spinning Effect
                let interval = setInterval(() => {
                    setSlots({
                        category: categories[Math.floor(Math.random() * categories.length)],
                        action: actions[Math.floor(Math.random() * actions.length)].label
                    });
                }, 80);

                setTimeout(() => {
                    clearInterval(interval);
                    const finalCategory = categories[Math.floor(Math.random() * categories.length)];
                    const finalActionObj = actions[Math.floor(Math.random() * actions.length)];
                    
                    setSlots({ category: finalCategory, action: finalActionObj.label });
                    
                    // 1. Filter Courses by Category
                    const catCourses = courses.filter(c => c.category && c.category.toUpperCase() === finalCategory);
                    
                    if (catCourses.length > 0) {
                        // 2. Flatten all lectures in this category
                        let allLectures = catCourses.flatMap(course => 
                            course.chapters.flatMap(ch => 
                                ch.lectures.map(l => ({
                                    ...l, 
                                    courseId: course.id, 
                                    courseTitle: course.title,
                                    courseImage: course.image,
                                    courseObj: course
                                }))
                            )
                        );

                        // 3. Apply Criteria Filter
                        let filteredLectures = allLectures.filter(finalActionObj.filter);
                        
                        // Fallback: If filter is too strict and returns nothing, just pick random from category
                        if (filteredLectures.length === 0) {
                            filteredLectures = allLectures; 
                        }
                        
                        if (filteredLectures.length > 0) {
                            const randomLecture = filteredLectures[Math.floor(Math.random() * filteredLectures.length)];
                            setRecommendation(randomLecture);
                        } else {
                            setRecommendation(null);
                        }
                    } else {
                         setRecommendation(null);
                    }
                    
                    setIsSpinning(false);
                }, 2000);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 md:px-8 mb-12 animate-slide-up">
                    <div className="bg-gradient-to-br from-toss-grey900 to-toss-black rounded-[32px] p-6 md:p-10 shadow-floating text-white relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-toss-blue/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl translate-y-1/3 -translate-x-1/3"></div>

                        <div className="relative z-10 flex flex-col md:flex-row items-center gap-8 md:gap-12">
                            <div className="text-center md:text-left flex-1">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur border border-white/10 text-[11px] font-bold text-yellow-300 mb-4">
                                    <Icons.Zap size={14} className="fill-current" />
                                    <span>KNOWLEDGE SLOT MACHINE V2</span>
                                </div>
                                <h3 className="text-2xl md:text-3xl font-bold leading-tight mb-2">
                                    오늘은 무엇을 공부할까요?
                                </h3>
                                <p className="text-toss-grey400 text-sm leading-relaxed">
                                    단순 랜덤이 아닙니다. 당신의 상황에 딱 맞는<br className="hidden md:block"/>
                                    최적의 지식(Action Criteria)을 찾아드립니다.
                                </p>
                            </div>

                            <div className="flex gap-2 md:gap-4 bg-white/5 p-4 rounded-2xl border border-white/10 backdrop-blur-sm">
                                <div className="bg-toss-grey900 border border-toss-grey700 rounded-xl w-32 md:w-40 h-24 flex items-center justify-center text-center p-2 relative overflow-hidden">
                                     <span className={`font-bold text-lg md:text-xl transition-all ${isSpinning ? 'blur-[1px]' : 'text-blue-400'}`}>
                                        {slots.category}
                                     </span>
                                     {isSpinning && <div className="absolute inset-0 bg-gradient-to-b from-toss-grey900/50 via-transparent to-toss-grey900/50"></div>}
                                </div>

                setRecommendedLecture(lecture); 
            };

            const handlePlayFromGrimoire = (lecture, course) => {
                setSelectedCourse(course);
                setRecommendedLecture(lecture);
            };

            return (
                <div className="min-h-screen pb-20 bg-toss-bg">
                    <nav className="sticky top-0 z-30 bg-toss-bg/80 backdrop-blur-lg border-b border-toss-grey200 transition-all">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-8">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.location.reload()}>
                                    <div className="w-8 h-8 bg-toss-blue rounded-lg flex items-center justify-center">
                                        <span className="text-white font-bold text-sm">J&J</span>
                                    </div>
                                    <span className="text-lg font-bold text-toss-black tracking-tight hidden md:block">Archive</span>
                                </div>

                                <div className="hidden md:flex bg-toss-grey200/50 p-1 rounded-xl">
                                    <button 
                                        onClick={() => setCurrentTab('HOME')}
                                        className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${currentTab === 'HOME' ? 'bg-white text-toss-blue shadow-sm' : 'text-toss-grey600 hover:text-toss-grey900'}`}
                                    >
                                        홈
                                    </button>
                                    <button 
                                        onClick={() => setCurrentTab('GRIMOIRE')}
                                        className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-1.5 ${currentTab === 'GRIMOIRE' ? 'bg-white text-toss-blue shadow-sm' : 'text-toss-grey600 hover:text-toss-grey900'}`}
                                    >
                                        <Icons.Book size={14}/>
                                        마도서
                                    </button>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-white rounded-full border border-toss-grey200 shadow-sm">
                                    <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                    <span className="text-xs font-medium text-toss-grey700">{user.email}</span>
                                </div>
                                <button 
                                    onClick={onLogout}
                                    className="p-2 text-toss-grey600 hover:bg-toss-grey200 rounded-full transition-colors"
                                    title="로그아웃"
                                >
                                    <Icons.LogOut size={20} />
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-toss-grey200 p-2 z-40 flex justify-around">
                        <button onClick={() => setCurrentTab('HOME')} className={`flex flex-col items-center p-2 ${currentTab === 'HOME' ? 'text-toss-blue' : 'text-toss-grey400'}`}>
                            <Icons.Layout size={20} />
                            <span className="text-[10px] font-bold mt-1">홈</span>
                        </button>
                        <button onClick={() => setCurrentTab('GRIMOIRE')} className={`flex flex-col items-center p-2 ${currentTab === 'GRIMOIRE' ? 'text-toss-blue' : 'text-toss-grey400'}`}>
                            <Icons.Book size={20} />
                            <span className="text-[10px] font-bold mt-1">마도서</span>
                        </button>
                    </div>

                    {currentTab === 'HOME' ? (
                        <>
                            <header className="max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-20 animate-slide-up">
                                <h1 className="text-3xl md:text-5xl font-bold text-toss-black mb-4 leading-tight">
                                    {getGreeting()}, {getUserName(user.email)}님.<br/>
                                    <span className="text-toss-grey400">오늘은 어떤 인사이트가 필요하신가요?</span>
                                </h1>
                                <p className="text-toss-grey600 max-w-2xl text-base md:text-lg">
                                    엄선된 지식들이 당신을 기다리고 있습니다. 본질에 집중할 수 있는 시간입니다.
                                </p>
                            </header>

                            <KnowledgeSlotMachine courses={COURSES} onRecommend={handleRecommendation} />

                            <div className="max-w-7xl mx-auto px-4 md:px-8 mb-10 overflow-x-auto scrollbar-hide">
                                <div className="flex gap-2 min-w-max">
                                    <button 
                                        onClick={() => setSelectedCategory('ALL')}
                                        className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all ${
                                            selectedCategory === 'ALL' 
                                            ? 'bg-toss-black text-white shadow-lg' 
                                            : 'bg-white text-toss-grey600 hover:bg-toss-grey100 border border-toss-grey200'
                                        }`}
                                    >
                                        전체 보기
                                    </button>
                                    {Object.values(CATEGORIES).map(cat => (
                                        <button 
                                            key={cat.id}
                                            onClick={() => setSelectedCategory(cat.id)}
                                            className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all ${
                                                selectedCategory === cat.id 
                                                ? 'bg-toss-blue text-white shadow-lg shadow-blue-500/30' 
                                                : 'bg-white text-toss-grey600 hover:bg-toss-grey100 border border-toss-grey200'
                                            }`}
                                        >
                                            {cat.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <main className="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 animate-slide-up" style={{animationDelay: '0.1s'}}>
                                {filteredCourses.map(course => (
                                    <CourseCard 
                                        key={course.id} 
                                        course={course} 
                                        onClick={(c) => { setSelectedCourse(c); setRecommendedLecture(null); }} 
                                    />
                                ))}
                            </main>
                        </>
                    ) : (
                        <div className="pt-8">
                            <Grimoire 
                                courses={COURSES} 
                                notes={userNotes}
                                onSaveNote={handleSaveNote}
                                onPlayLecture={handlePlayFromGrimoire} 
                            />
                        </div>
                    )}

                    {selectedCourse && (
                        <LecturePlayer 
                            course={selectedCourse}
                            initialLecture={recommendedLecture}
                            notes={userNotes}
                            onSaveNote={handleSaveNote}
                            onClose={() => { setSelectedCourse(null); setRecommendedLecture(null); }} 
                        />
                    )}

                    {currentTab === 'HOME' && (
                        <footer className="max-w-7xl mx-auto px-4 md:px-8 mt-32 border-t border-toss-grey200 py-12 animate-fade-in">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                <div>
                                    <h5 className="font-bold text-toss-grey800 text-sm mb-3">J&J Archive</h5>
                                    <p className="text-toss-grey500 text-xs leading-relaxed">
                                        서로의 성장을 돕기 위해 구축한<br/>
                                        세상에서 가장 안전하고 프라이빗한 디지털 서재
                                    </p>
                                </div>
                                <div className="flex flex-wrap gap-x-6 gap-y-2 text-xs text-toss-grey600">
                                    <span className="cursor-pointer hover:text-toss-blue transition-colors">서비스 이용약관</span>
                                    <span className="cursor-pointer hover:text-toss-blue font-bold transition-colors">개인정보처리방침</span>
                                    <span className="cursor-pointer hover:text-toss-blue transition-colors">고객센터</span>
                                </div>
                            </div>

                            <div className="text-[11px] text-toss-grey400 leading-relaxed font-normal">
                                <p className="mb-1 flex flex-wrap gap-2">
                                    <span><strong className="text-toss-grey600 font-medium">상호명:</strong> 마지막케팅 & 텐밀리플러스</span>
                                    <span className="hidden sm:inline text-toss-grey300">|</span>
                                    <span><strong className="text-toss-grey600 font-medium">대표자:</strong> 김지후, 최재영</span>
                                </p>
                                <p className="mb-1 flex flex-wrap gap-2">
                                    <span>사업자등록번호: 2005-513-0420</span>
                                    <span className="hidden sm:inline text-toss-grey300">|</span>
                                    <span>통신판매업신고: 제 2025-서울강남-00123호</span>
                                </p>
                                <p className="mb-4 flex flex-wrap gap-2">
                                    <span>주소: 서울특별시 강남구 테헤란로 (Private Office)</span>
                                    <span className="hidden sm:inline text-toss-grey300">|</span>
                                    <span>이메일: choijihoon9988@gmail.com, jihoo0420@gmail.com</span>
                                </p>
                                <p className="opacity-70">© 2025 J&J Archive. All rights reserved.</p>
                            </div>
                        </footer>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const { auth, onAuthStateChanged } = window.firebaseAuth;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogout = () => {
                const { auth, signOut } = window.firebaseAuth;
                signOut(auth).then(() => setUser(null));
            };

            if (loading) return (
                <div className="h-screen w-full flex items-center justify-center bg-toss-bg">
                    <div className="w-8 h-8 border-4 border-toss-blue border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            return user ? <Dashboard user={user} onLogout={handleLogout} /> : <LoginScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
