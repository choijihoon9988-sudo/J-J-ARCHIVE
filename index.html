    <script src="./jachung_data.js"></script>

        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */

</head>
<body class="bg-brand-black text-white antialiased overflow-x-hidden selection:bg-brand-gold selection:text-black">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxay6-q869MxmJopDtogmT6A4vfXWtlEg",
            authDomain: "jnj-archive.firebaseapp.com",
            projectId: "jnj-archive",
            storageBucket: "jnj-archive.firebasestorage.app",
            messagingSenderId: "88774036980",
            appId: "1:88774036980:web:f1d25f87f063d7037dbda1"

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.firebaseAuth = { auth, provider, signInWithPopup, signOut, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---------------------------------------------------------
        // [FIX] 아이콘 컴포넌트 직접 정의 (외부 라이브러리 의존성 제거)
        // ---------------------------------------------------------
        const Icons = {
            Play: ({size=24, className, fill="currentColor"}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Lock: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            X: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            LogOut: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            Briefcase: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>,
            Brain: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path></svg>,
            Heart: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>,
            Zap: ({size=24, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        };

        // ---------------------------------------------------------
        // 데이터: 엘리트 커리큘럼 데이터베이스 통합
        // ---------------------------------------------------------
        const CATEGORIES = {
            BUSINESS: { id: 'business', name: 'Business & Wealth', icon: <Icons.Briefcase size={14} />, color: 'text-blue-400' },
            MINDSET: { id: 'mindset', name: 'Hyper-Thinking', icon: <Icons.Brain size={14} />, color: 'text-purple-400' },
            PSYCHOLOGY: { id: 'psychology', name: 'Psychology & Love', icon: <Icons.Heart size={14} />, color: 'text-brand-burgundy' },
            TECH: { id: 'tech', name: 'AI & Tech', icon: <Icons.Zap size={14} />, color: 'text-green-400' },
        };

        // [DATA AGGREGATION] window 객체에 로드된 데이터들을 하나의 배열로 통합
        const COURSES = [
            window.JACHUNG_COURSE_DATA,  // AI 강의
            window.COURSE_DATA_WRITING,  // 글쓰기 강의
            window.COURSE_DATA_MBTI,     // MBTI 강의
            window.COURSE_DATA_INSTA,    // 인스타 강의
            window.COURSE_DATA_LEESEOP   // 연애 강의
        ].filter(Boolean);

        // ---------------------------------------------------------
        // 보안: 화이트리스트 (WhiteList) 설정
        // ---------------------------------------------------------
        const ALLOWED_EMAILS = [
            "jihoo@example.com",     
            "admin@example.com",
            "test@example.com",
            "choijihoon9988@gmail.com",
            "jihoo0420@gmail.com"
        ];

        // ---------------------------------------------------------
        // 컴포넌트: 로그인 화면 (The Gate)
        // ---------------------------------------------------------
        const LoginScreen = ({ onLogin }) => {
            const [error, setError] = useState(null);
            const [isAuthenticating, setIsAuthenticating] = useState(false);

            const handleSignIn = () => {
                setIsAuthenticating(true);
                setError(null);
                const { auth, provider, signInWithPopup } = window.firebaseAuth;
                
                signInWithPopup(auth, provider)
                   .then((result) => {
                        const email = result.user.email;
                        if (ALLOWED_EMAILS.includes(email)) {
                            onLogin(result.user);
                        } else {
                             setError(`Access Denied: ${email} 은(는) 승인된 계정이 아닙니다.`);
                             window.firebaseAuth.signOut(auth);
                             setIsAuthenticating(false);
                        }
                    })
                   .catch((error) => {
                        console.error(error);
                        setError("인증 시스템 오류: " + error.message);
                        setIsAuthenticating(false);
                    });
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-brand-black relative overflow-hidden no-select">
                    <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-gold blur-[180px] opacity-5 rounded-full animate-pulse-slow"></div>

                    <div className="z-10 text-center space-y-10 max-w-md px-6 animate-fade-in">
                        <div className="space-y-4">
                            <h1 className="text-6xl md:text-7xl font-serif text-white tracking-tighter">J&J Archive</h1>
                            <p className="text-brand-gold tracking-[0.3em] text-[10px] font-bold uppercase">Knowledge for the Chosen Few</p>
                        </div>
                        
                        <div className="h-px w-16 bg-gray-800 mx-auto"></div>

                        <p className="text-gray-500 font-sans text-xs leading-relaxed tracking-wide">
                            본 아카이브는 폐쇄형으로 운영됩니다.<br/>
                            사전에 인가된 계정으로만 접근이 가능합니다.
                        </p>

                        <button 
                            onClick={handleSignIn}
                            disabled={isAuthenticating}
                            className="group relative px-10 py-4 bg-white text-black font-semibold text-xs tracking-widest uppercase transition-all hover:bg-gray-200 disabled:opacity-50"
                        >
                            <span className="relative z-10 flex items-center gap-3">
                                {isAuthenticating? 'VERIFYING...' : <><Icons.Lock size={14} /> ENTER ARCHIVE</>}
                            </span>
                        </button>

                        {error && (
                            <div className="mt-4 p-4 bg-red-950/30 border border-red-900/50 text-red-400 text-[10px] tracking-wide">
                                ⚠ {error}
                            </div>
                        )}
                    </div>
                    
                    <div className="absolute bottom-8 text-gray-800 text-[9px] font-mono">
                        SECURE CONNECTION • ENCRYPTED • V.1.0.0
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // 컴포넌트: 통합 강의 플레이어 (Lecture Room)
        // ---------------------------------------------------------
        const LecturePlayer = ({ course, onClose }) => {
            // 초기 상태: 첫 번째 챕터의 첫 번째 강의
            const [currentLecture, setCurrentLecture] = useState(() => {
                return course.chapters?.[0]?.lectures?.[0] || null;
            });

            // 스크롤 방지
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => document.body.style.overflow = 'unset';
            }, []);

            if (!currentLecture) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md animate-fade-in p-0">
                   {/* Layout Wrapper */}
                   <div className="w-full h-full md:h-[90vh] md:w-[90vw] max-w-7xl flex flex-col md:flex-row bg-brand-dark overflow-hidden rounded-sm border border-white/10 shadow-2xl relative">
                        
                        {/* Close Button */}
                        <button 
                            onClick={onClose}
                            className="absolute top-4 right-4 z-[60] text-white/50 hover:text-white bg-black/50 hover:bg-black/80 p-2 rounded-full transition-all"
                        >
                            <Icons.X size={24} />
                        </button>

                        {/* Left: Video Player Section */}
                        <div className="flex-1 bg-black flex flex-col relative group">
                             {/* Iframe Area */}
                             <div className="relative w-full h-full flex items-center justify-center bg-black">
                                <iframe 
                                    className="w-full h-full aspect-video"
                                    src={`https://www.youtube.com/embed/${currentLecture.videoId}?autoplay=1&modestbranding=1&rel=0&showinfo=0`}
                                    title={currentLecture.title}
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                ></iframe>
                                {/* Video Shield (Optional protection) */}
                                <div className="video-shield top-0 left-0 w-full h-[10%]"></div>
                             </div>
                             
                             {/* Current Title Bar (Mobile/Overlay) */}
                             <div className="hidden md:block absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black via-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                                <h2 className="text-xl font-serif text-white">{currentLecture.title}</h2>
                             </div>
                        </div>

                        {/* Right: Curriculum Sidebar */}
                        <div className="w-full h-[40%] md:h-full md:w-[400px] bg-brand-surface border-t md:border-t-0 md:border-l border-white/5 flex flex-col">
                            {/* Sidebar Header */}
                            <div className="p-4 md:p-6 border-b border-white/5 bg-brand-black/50 shrink-0">
                                <span className="text-[10px] text-brand-gold font-bold tracking-widest uppercase mb-1 md:mb-2 block">Now Playing</span>
                                <h3 className="text-base md:text-lg font-serif text-white leading-tight truncate">{course.title}</h3>
                                <p className="hidden md:block text-xs text-gray-500 mt-2 line-clamp-2">{course.description}</p>
                            </div>

                            {/* Chapter List (Scrollable) */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-6 scrollbar-hide">
                                {course.chapters.map((chapter, cIndex) => (
                                    <div key={cIndex} className="animate-slide-up" style={{animationDelay: `${cIndex * 0.1}s`}}>
                                        <h4 className="text-[10px] md:text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-2 md:mb-3 px-2 flex items-center gap-2">
                                            <span className="w-1 h-1 rounded-full bg-brand-gold"></span>
                                            {chapter.title}
                                        </h4>
                                        <div className="space-y-1">
                                            {chapter.lectures.map((lecture, lIndex) => {
                                                const isActive = currentLecture.videoId === lecture.videoId && currentLecture.title === lecture.title; 
                                                return (
                                                    <button
                                                        key={lIndex}
                                                        onClick={() => setCurrentLecture(lecture)}
                                                        className={`w-full text-left p-2 md:p-3 rounded-sm text-xs transition-all duration-200 flex items-start gap-3 group
                                                            ${isActive 
                                                                ? 'bg-brand-gold/10 text-brand-gold border border-brand-gold/20' 
                                                                : 'text-gray-400 hover:bg-white/5 hover:text-gray-200 border border-transparent'
                                                            }`}
                                                    >
                                                        <div className={`mt-0.5 ${isActive ? 'text-brand-gold' : 'text-gray-600 group-hover:text-gray-400'}`}>
                                                            {isActive ? <Icons.Play size={12} fill="currentColor"/> : <div className="w-3 h-3 rounded-full border border-current opacity-40"></div>}
                                                        </div>
                                                        <div className="flex-1">
                                                            <span className="block leading-relaxed line-clamp-2">{lecture.title}</span>
                                                            <span className="text-[9px] opacity-50 mt-1 block font-mono">{lecture.duration}</span>
                                                        </div>
                                                    </button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                   </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // 컴포넌트: 강의 카드 (The MasterClass Effect)
        // ---------------------------------------------------------
        const CourseCard = ({ course, onClick }) => {
            const categoryName = course.category && CATEGORIES[course.category.toUpperCase()] 
                                ? CATEGORIES[course.category.toUpperCase()].name 
                                : 'Special Course';
            const categoryColor = course.category && CATEGORIES[course.category.toUpperCase()]
                                ? CATEGORIES[course.category.toUpperCase()].color
                                : 'text-gray-400';

            return (
                <div 
                    onClick={() => onClick(course)}
                    className="group relative cursor-pointer w-full aspect-[16/10] overflow-hidden rounded-sm bg-brand-surface transition-all duration-700 hover:scale-[1.01] hover:shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/5 hover:border-brand-gold/30"
                >
                    <img 
                        src={course.image} 
                        alt={course.title} 
                        className="absolute inset-0 w-full h-full object-cover opacity-60 transition-transform duration-1000 group-hover:scale-110 group-hover:opacity-100"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-90 transition-opacity duration-700 group-hover:opacity-60"></div>

                    <div className="absolute bottom-0 left-0 w-full p-6 md:p-8 translate-y-4 transition-transform duration-500 group-hover:translate-y-0">
                        <div className="flex items-center gap-2 mb-3 opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100 transform -translate-x-2 group-hover:translate-x-0">
                            <span className={`text-[9px] font-bold tracking-[0.2em] uppercase px-2 py-1 bg-white/10 backdrop-blur-sm rounded-sm ${categoryColor} border border-white/5`}>
                                {categoryName}
                            </span>
                        </div>
                        
                        <p className="text-gray-400 text-[10px] font-bold tracking-widest uppercase mb-2">
                            {course.instructor}
                        </p>
                        
                        <h3 className="text-xl md:text-2xl font-serif text-white leading-tight mb-3 group-hover:text-brand-gold transition-colors duration-300">
                            {course.title}
                        </h3>

                        <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-500">
                            <div className="overflow-hidden">
                                <p className="text-gray-300 text-xs leading-relaxed font-light border-l border-brand-gold/50 pl-3 mb-4 opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-200">
                                    {course.description}
                                </p>
                                <div className="flex items-center gap-2 text-[10px] font-bold text-white uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-300">
                                    <div className="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-brand-gold transition-colors">
                                        <Icons.Play size={12} />
                                    </div>
                                    <span>Watch Class</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // 컴포넌트: 메인 대시보드
        // ---------------------------------------------------------
        const Dashboard = ({ user, onLogout }) => {
            const [selectedCourse, setSelectedCourse] = useState(null);
            const [filter, setFilter] = useState('ALL');

            const filteredCourses = filter === 'ALL' 
               ? COURSES 
               : COURSES.filter(c => c.category && c.category.toLowerCase() === filter.toLowerCase());

            return (
                <div className="min-h-screen bg-brand-dark pb-20 no-select">
                    <nav className="sticky top-0 z-40 bg-brand-black/80 backdrop-blur-lg border-b border-white/5">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <span className="text-lg font-serif text-white font-bold tracking-tight">J&J Archive</span>
                                <span className="hidden md:inline-block h-3 w-px bg-gray-800"></span>
                                <span className="hidden md:inline-block text-[10px] text-gray-600 tracking-widest uppercase">For Jihoo Only</span>
                            </div>
                            
                            <div className="flex items-center gap-6">
                                <div className="hidden md:flex items-center gap-3 text-[10px] text-gray-500 font-mono">
                                    <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                                    <span>{user.email}</span>
                                </div>
                                <button 
                                    onClick={onLogout}
                                    className="text-gray-500 hover:text-white transition-colors"
                                    title="Disconnect"
                                >
                                    <Icons.LogOut size={16} />
                                </button>
                            </div>
                        </div>
                    </nav>

                    <header className="max-w-7xl mx-auto px-6 py-16 md:py-24">
                        <h1 className="text-4xl md:text-6xl font-serif text-white mb-6 animate-slide-up leading-tight">
                            Welcome back, <br/>
                            <span className="text-gray-600 italic">Initiate.</span>
                        </h1>
                        <p className="text-gray-400 max-w-xl text-sm font-light leading-relaxed animate-slide-up" style={{animationDelay: '0.1s'}}>
                            당신의 성공 알고리즘을 위한 데이터베이스가 준비되었습니다.<br/>
                            외부의 소음을 차단하고, 본질에 집중하십시오.
                        </p>
                    </header>

                    <div className="max-w-7xl mx-auto px-6 mb-12 overflow-x-auto scrollbar-hide">
                        <div className="flex gap-3 min-w-max pb-4">
                            <button 
                                onClick={() => setFilter('ALL')}
                                className={`px-5 py-2.5 text-[10px] font-bold tracking-widest uppercase border transition-all duration-300 rounded-sm ${filter === 'ALL'? 'border-brand-gold text-brand-gold bg-brand-gold/5' : 'border-white/10 text-gray-500 hover:border-white/30 hover:text-white'}`}
                            >
                                All Archive
                            </button>
                            {Object.values(CATEGORIES).map(cat => (
                                <button 
                                    key={cat.id}
                                    onClick={() => setFilter(cat.id)}
                                    className={`flex items-center gap-2 px-5 py-2.5 text-[10px] font-bold tracking-widest uppercase border transition-all duration-300 rounded-sm ${filter === cat.id? `border-${cat.color.split('-')}-400 text-white bg-white/5` : 'border-white/10 text-gray-500 hover:border-white/30 hover:text-white'}`}
                                >
                                    {cat.icon}
                                    {cat.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-slide-up" style={{animationDelay: '0.2s'}}>
                        {filteredCourses.map(course => (
                            <CourseCard 
                                key={course.id} 
                                course={course} 
                                onClick={setSelectedCourse} 
                            />
                        ))}
                    </main>

                    {selectedCourse && (
                        <LecturePlayer 
                            course={selectedCourse}
                            onClose={() => setSelectedCourse(null)} 
                        />
                    )}

                    <footer className="max-w-7xl mx-auto px-6 mt-32 border-t border-white/5 pt-8 text-center md:text-left">
                        <p className="text-[10px] text-gray-700 font-mono tracking-widest uppercase">
                            J&J Archive © 2024 | Confidential Material | Unauthorized distribution prohibited.
                        </p>
                    </footer>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const { auth, onAuthStateChanged } = window.firebaseAuth;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) {
                        // 화이트리스트 체크 (테스트 시엔 잠시 주석 처리 가능)
                        // if(ALLOWED_EMAILS.includes(currentUser.email)) {
                            setUser(currentUser);
                        // }
                    } else {
                        setUser(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogout = () => {
                const { auth, signOut } = window.firebaseAuth;
                signOut(auth).then(() => setUser(null));
            };

            if (loading) return (
                <div className="h-screen bg-black flex flex-col items-center justify-center gap-4">
                    <div className="w-8 h-8 border-2 border-brand-gold border-t-transparent rounded-full animate-spin"></div>
                    <div className="text-brand-gold text-[10px] tracking-[0.5em] animate-pulse">SYSTEM LOADING...</div>
                </div>
            );

            return user ? <Dashboard user={user} onLogout={handleLogout} /> : <LoginScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
