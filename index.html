<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>J&J Archive | Private Library</title>
    <meta name="description" content="친구의 성장을 돕기 위해 구축한 세상에서 가장 안전하고 프라이빗한 디지털 서재">
    <meta property="og:type" content="website">

    <meta property="og:image" content="./AI.png">
    <meta property="og:locale" content="ko_KR">

    <meta name="theme-color" content="#F2F4F6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233182F6%22/><text x=%2250%22 y=%2250%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2240%22 fill=%22white%22>J&J</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="./jachung_data.js"></script>
    <script src="./writing_data.js"></script>
    <script src="./mbti_data.js"></script>
    <script src="./insta_data.js"></script>
    <script src="./leeseop_data.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
                    },
                    colors: {
                        toss: {
                            bg: '#F2F4F6',
                            white: '#FFFFFF',
                            blue: '#3182F6',
                            blueLight: '#E8F3FF',
                            black: '#191F28',
                            grey900: '#191F28',
                            grey800: '#333D4B',
                            grey700: '#4E5968',
                            grey600: '#6B7684',
                            grey500: '#8B95A1',
                            grey400: '#B0B8C1',
                            grey300: '#D1D6DB',
                            grey200: '#E5E8EB',
                            grey100: '#F2F4F6',
                        }
                    },
                    boxShadow: {
                        'card': '0 4px 24px 0 rgba(0, 0, 0, 0.04)',
                        'card-hover': '0 12px 32px 0 rgba(0, 0, 0, 0.08)',
                        'floating': '0 20px 60px 0 rgba(0, 0, 0, 0.12)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F2F4F6;
            color: #191F28;
            -webkit-font-smoothing: antialiased;
        }
        
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Hide scrollbar but keep functionality */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Scrollbar for content areas */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D1D6DB; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #B0B8C1; }

</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxay6-q869MxmJopDtogmT6A4vfXWtlEg",
            authDomain: "jnj-archive.firebaseapp.com",
            projectId: "jnj-archive",
            storageBucket: "jnj-archive.firebasestorage.app",
            messagingSenderId: "88774036980",
            appId: "1:88774036980:web:f1d25f87f063d7037dbda1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.firebaseAuth = { auth, provider, signInWithPopup, signOut, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons (Feather Icons style) ---
        const Icons = {
            Play: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Lock: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            X: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            LogOut: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            Check: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>,
            ChevronRight: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>,
            ExternalLink: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            Search: ({size=20, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
        };

        // --- Config & Data ---
        const CATEGORIES = {
            BUSINESS: { id: 'business', name: 'Business', color: 'bg-blue-100 text-blue-600' },
            MINDSET: { id: 'mindset', name: 'Mindset', color: 'bg-purple-100 text-purple-600' },
            PSYCHOLOGY: { id: 'psychology', name: 'Psychology', color: 'bg-rose-100 text-rose-600' },
            TECH: { id: 'tech', name: 'Tech', color: 'bg-emerald-100 text-emerald-600' },
        };

        const ALLOWED_EMAILS = [
            "jihoo@example.com",
            "choijihoon9988@gmail.com",
            "jihoo0420@gmail.com"
        ];

        // Combine Data
        const COURSES = [
            window.JACHUNG_COURSE_DATA,
            window.COURSE_DATA_WRITING,
            window.COURSE_DATA_MBTI,
            window.COURSE_DATA_INSTA,
            window.COURSE_DATA_LEESEOP
        ].filter(Boolean);


        // --- Component: Login Screen ---
        const LoginScreen = ({ onLogin }) => {
            const [error, setError] = useState(null);
            const [isAuthenticating, setIsAuthenticating] = useState(false);

            const handleSignIn = () => {
                setIsAuthenticating(true);
                setError(null);
                const { auth, provider, signInWithPopup, signOut } = window.firebaseAuth;
                
                signInWithPopup(auth, provider)
                   .then((result) => {
                        const email = result.user.email;
                        // Whitelist Check
                        if (ALLOWED_EMAILS.includes(email)) {
                            onLogin(result.user);
                        } else {
                             setError("죄송합니다. 초대된 사용자만 접근할 수 있습니다.");
                             signOut(auth);
                             setIsAuthenticating(false);
                        }
                    })
                   .catch((error) => {
                        console.error(error);
                        setError("인증에 실패했습니다. 다시 시도해주세요.");
                        setIsAuthenticating(false);
                    });
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-toss-bg p-6">
                    <div className="w-full max-w-[400px] animate-fade-in flex flex-col items-center">
                        <div className="w-16 h-16 bg-toss-blue rounded-3xl flex items-center justify-center mb-8 shadow-lg shadow-blue-500/20">
                            <Icons.Lock className="text-white w-8 h-8" />
                        </div>
                        
                        <h1 className="text-3xl font-bold text-toss-black mb-3 text-center">J&J Archive</h1>
                        <p className="text-toss-grey600 text-center mb-10 leading-relaxed">
                            친구 지후의 성장을 위해 준비된<br/>
                            프라이빗 지식 플랫폼입니다.
                        </p>

                        <div className="bg-white p-8 rounded-[32px] shadow-card w-full">
                            <button 
                                onClick={handleSignIn}
                                disabled={isAuthenticating}
                                className="w-full py-4 bg-toss-blue hover:bg-blue-600 text-white font-semibold rounded-2xl transition-all active:scale-[0.98] disabled:opacity-70 flex items-center justify-center gap-2"
                            >
                                {isAuthenticating ? (
                                    <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                ) : (
                                    <>
                                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5 bg-white rounded-full p-0.5" alt="G" />
                                        <span>Google 계정으로 계속하기</span>
                                    </>
                                )}
                            </button>
                            
                            {error && (
                                <div className="mt-4 p-3 bg-red-50 text-red-500 text-sm rounded-xl text-center font-medium">
                                    {error}
                                </div>
                            )}

                            <p className="mt-6 text-[13px] text-toss-grey400 text-center">
                                승인된 계정(choijihoon9988, jihoo0420)만<br/>접속이 가능합니다.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };


        // --- Component: Lecture Player (Modal) ---
        const LecturePlayer = ({ course, onClose }) => {
            const [currentLecture, setCurrentLecture] = useState(() => course.chapters?.[0]?.lectures?.[0] || null);

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => document.body.style.overflow = 'unset';
            }, []);

            const handleLaunchVideo = () => {
                if (!currentLecture || !currentLecture.videoId) return;
                let videoId = currentLecture.videoId.trim();
                let url = videoId.startsWith('http') ? videoId : `https://www.youtube.com/watch?v=${videoId}`;
                window.open(url, '_blank');
            };

            if (!currentLecture) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 animate-fade-in">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    
                    <div className="relative bg-white w-full max-w-6xl h-[85vh] rounded-[32px] shadow-2xl overflow-hidden flex flex-col md:flex-row animate-slide-up">
                        
                        {/* Mobile Close Button */}
                        <button onClick={onClose} className="absolute top-4 right-4 z-50 p-2 bg-white/10 backdrop-blur-md rounded-full md:hidden">
                            <Icons.X className="text-white" />
                        </button>

                        {/* Left: Player / Launcher Area */}
                        <div className="flex-[1.5] bg-toss-grey900 relative flex flex-col">
                             {/* Background Overlay */}
                             <div className="absolute inset-0 z-0">
                                <img src={course.image} className="w-full h-full object-cover opacity-20 blur-xl scale-110" />
                                <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/60 to-transparent"></div>
                             </div>

                             <div className="relative z-10 flex-1 flex flex-col items-center justify-center p-10 text-center text-white">
                                <div className="mb-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-[11px] font-bold tracking-wider uppercase text-blue-200">
                                    Private Source
                                </div>
                                <h2 className="text-2xl md:text-4xl font-bold mb-8 leading-tight max-w-2xl text-shadow-sm">
                                    {currentLecture.title}
                                </h2>
                                
                                <button 
                                    onClick={handleLaunchVideo}
                                    className="group relative px-8 py-4 bg-toss-blue hover:bg-blue-500 text-white rounded-2xl font-semibold text-lg transition-all hover:scale-105 shadow-lg shadow-blue-500/30 flex items-center gap-3"
                                >
                                    <Icons.Play fill="currentColor" className="group-hover:translate-x-0.5 transition-transform" />
                                    <span>영상 재생하기</span>
                                </button>
                                
                                <p className="mt-8 text-white/40 text-sm max-w-md">
                                    보안을 위해 외부 플레이어(YouTube)로 안전하게 연결됩니다.<br/>
                                    초대된 계정으로 로그인되어 있어야 재생이 가능합니다.
                                </p>
                             </div>
                        </div>

                        {/* Right: Curriculum List */}
                        <div className="flex-1 bg-white flex flex-col border-l border-toss-grey200 max-h-[50vh] md:max-h-full">
                            <div className="p-6 border-b border-toss-grey100 flex justify-between items-start">
                                <div>
                                    <h3 className="text-lg font-bold text-toss-black">{course.title}</h3>
                                    <p className="text-sm text-toss-grey500 mt-1">{course.instructor} • Total {course.chapters.reduce((acc, ch) => acc + ch.lectures.length, 0)} lectures</p>
                                </div>
                                <button onClick={onClose} className="hidden md:block p-2 hover:bg-toss-grey100 rounded-full transition-colors text-toss-grey600">
                                    <Icons.X />
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scroll p-4">
                                {course.chapters.map((chapter, idx) => (
                                    <div key={idx} className="mb-6">
                                        <h4 className="text-xs font-bold text-toss-grey500 uppercase tracking-wider mb-3 px-2">
                                            {chapter.title}
                                        </h4>
                                        <div className="space-y-1">
                                            {chapter.lectures.map((lecture, lIdx) => {
                                                const isActive = currentLecture.title === lecture.title;
                                                return (
                                                    <button
                                                        key={lIdx}
                                                        onClick={() => setCurrentLecture(lecture)}
                                                        className={`w-full text-left p-3 rounded-xl flex items-center gap-3 transition-all duration-200
                                                            ${isActive 
                                                                ? 'bg-toss-blueLight text-toss-blue font-medium' 
                                                                : 'hover:bg-toss-grey100 text-toss-grey700'
                                                            }`}
                                                    >
                                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${isActive ? 'bg-toss-blue text-white' : 'bg-toss-grey200 text-toss-grey500'}`}>
                                                            {isActive ? <Icons.Play size={10} fill="currentColor"/> : <span className="text-[10px] font-bold">{lIdx + 1}</span>}
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="truncate text-[15px]">{lecture.title}</div>
                                                            <div className="text-[11px] opacity-60 mt-0.5">{lecture.duration}</div>
                                                        </div>
                                                    </button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Component: Course Card ---
        const CourseCard = ({ course, onClick }) => {
            const catStyle = course.category && CATEGORIES[course.category.toUpperCase()] 
                             ? CATEGORIES[course.category.toUpperCase()]
                             : { name: 'Special', color: 'bg-gray-100 text-gray-600' };

            return (
                <div 
                    onClick={() => onClick(course)}
                    className="group bg-white rounded-[24px] p-0 shadow-card hover:shadow-card-hover transition-all duration-300 cursor-pointer overflow-hidden flex flex-col h-full transform hover:-translate-y-1"
                >
                    <div className="relative h-48 overflow-hidden">
                        <img 
                            src={course.image} 
                            alt={course.title}
                            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-60"></div>
                        <div className="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                             <span className={`px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide bg-white/90 backdrop-blur-sm text-black`}>
                                {catStyle.name}
                             </span>
                        </div>
                    </div>
                    
                    <div className="p-6 flex flex-col flex-1">
                        <div className="text-xs font-semibold text-toss-grey500 mb-2">{course.instructor}</div>
                        <h3 className="text-lg font-bold text-toss-black leading-snug mb-3 group-hover:text-toss-blue transition-colors">
                            {course.title}
                        </h3>
                        <p className="text-toss-grey600 text-sm leading-relaxed line-clamp-2 mb-6 flex-1">
                            {course.description}
                        </p>
                        
                        <div className="flex items-center text-toss-blue font-semibold text-sm group/btn">
                            강의 보러가기 <Icons.ChevronRight className="ml-1 transition-transform group-hover/btn:translate-x-1" size={16} />
                        </div>
                    </div>
                </div>
            );
        };

        // --- Component: Dashboard ---
        const Dashboard = ({ user, onLogout }) => {
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [selectedCourse, setSelectedCourse] = useState(null);

            const filteredCourses = useMemo(() => {
                if (selectedCategory === 'ALL') return COURSES;
                return COURSES.filter(c => c.category && c.category.toLowerCase() === selectedCategory.toLowerCase());
            }, [selectedCategory]);

            // Personalized Greeting based on time
            const getGreeting = () => {
                const hour = new Date().getHours();
                if (hour < 12) return "좋은 아침입니다";
                if (hour < 18) return "좋은 오후입니다";
                return "좋은 저녁입니다";
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <nav className="sticky top-0 z-30 bg-toss-bg/80 backdrop-blur-lg border-b border-toss-grey200">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.location.reload()}>
                                <div className="w-8 h-8 bg-toss-blue rounded-lg flex items-center justify-center">
                                    <span className="text-white font-bold text-sm">J&J</span>
                                </div>
                                <span className="text-lg font-bold text-toss-black tracking-tight hidden md:block">Archive</span>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-white rounded-full border border-toss-grey200 shadow-sm">
                                    <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                    <span className="text-xs font-medium text-toss-grey700">{user.email}</span>
                                </div>
                                <button 
                                    onClick={onLogout}
                                    className="p-2 text-toss-grey600 hover:bg-toss-grey200 rounded-full transition-colors"
                                    title="로그아웃"
                                >
                                    <Icons.LogOut size={20} />
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-20 animate-slide-up">
                        <h1 className="text-3xl md:text-5xl font-bold text-toss-black mb-4 leading-tight">
                            {getGreeting()}, 지후님.<br/>
                            <span className="text-toss-grey400">오늘은 어떤 인사이트가 필요하신가요?</span>
                        </h1>
                        <p className="text-toss-grey600 max-w-2xl text-base md:text-lg">
                            엄선된 지식들이 당신을 기다리고 있습니다. 본질에 집중할 수 있는 시간입니다.
                        </p>
                    </header>

                    {/* Filters */}
                    <div className="max-w-7xl mx-auto px-4 md:px-8 mb-10 overflow-x-auto scrollbar-hide">
                        <div className="flex gap-2 min-w-max">
                            <button 
                                onClick={() => setSelectedCategory('ALL')}
                                className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all ${
                                    selectedCategory === 'ALL' 
                                    ? 'bg-toss-black text-white shadow-lg' 
                                    : 'bg-white text-toss-grey600 hover:bg-toss-grey100 border border-toss-grey200'
                                }`}
                            >
                                전체 보기
                            </button>
                            {Object.values(CATEGORIES).map(cat => (
                                <button 
                                    key={cat.id}
                                    onClick={() => setSelectedCategory(cat.id)}
                                    className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all ${
                                        selectedCategory === cat.id 
                                        ? 'bg-toss-blue text-white shadow-lg shadow-blue-500/30' 
                                        : 'bg-white text-toss-grey600 hover:bg-toss-grey100 border border-toss-grey200'
                                    }`}
                                >
                                    {cat.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Course Grid */}
                    <main className="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 animate-slide-up" style={{animationDelay: '0.1s'}}>
                        {filteredCourses.map(course => (
                            <CourseCard 
                                key={course.id} 
                                course={course} 
                                onClick={setSelectedCourse} 
                            />
                        ))}
                    </main>

                    {/* Lecture Player Modal */}
                    {selectedCourse && (
                        <LecturePlayer 
                            course={selectedCourse}
                            onClose={() => setSelectedCourse(null)} 
                        />
                    )}

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-4 md:px-8 mt-32 border-t border-toss-grey200 pt-8 flex flex-col md:flex-row justify-between items-center text-toss-grey400 text-xs">
                        <p>© 2025 J&J Archive. All rights reserved.</p>
                        <p className="mt-2 md:mt-0">Private & Confidential</p>
                    </footer>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const { auth, onAuthStateChanged } = window.firebaseAuth;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogout = () => {
                const { auth, signOut } = window.firebaseAuth;
                signOut(auth).then(() => setUser(null));
            };

            if (loading) return (
                <div className="h-screen w-full flex items-center justify-center bg-toss-bg">
                    <div className="w-8 h-8 border-4 border-toss-blue border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            return user ? <Dashboard user={user} onLogout={handleLogout} /> : <LoginScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
